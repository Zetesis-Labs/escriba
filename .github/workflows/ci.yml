name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SWIFT_VERSION: 6.3.3
  WASM_SDK_URL: https://download.swift.org/swift-6.3.3-release/wasm-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_wasm.artifactbundle.tar.gz
  WASM_SDK_CHECKSUM: cabfa08b73bb8ac783927ecd15fa386e99d0c139c5f232445067bcf58379cae7
  WASMTIME_VERSION: 48.0.2

jobs:
  macos:
    name: macOS · build y tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test

  linux:
    name: Linux · targets portables y de sistema
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev
      - name: Compilar lo que corre en un pod
        run: |
          for target in EscribaCore EscribaEngine EscribaSystemKit EscribaNotion EscribaStore; do
            swift build --target "$target"
          done

  wasi:
    name: WASI · el nucleo viaja
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -qq && apt-get install -y -qq curl xz-utils
      - name: SDK de WebAssembly
        run: swift sdk install "$WASM_SDK_URL" --checksum "$WASM_SDK_CHECKSUM"
      - name: Compilar motor y conector a wasm32-unknown-wasi
        run: |
          swift build --swift-sdk swift-6.3.3-RELEASE_wasm --target EscribaEngine
          swift build --swift-sdk swift-6.3.3-RELEASE_wasm --target EscribaNotion
          swift build --swift-sdk swift-6.3.3-RELEASE_wasm --product escriba-wasm-probe
      - name: Runtime WASI (wasmtime, fijado)
        run: |
          curl -sSL "https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/wasmtime-v${WASMTIME_VERSION}-x86_64-linux.tar.xz" | tar -xJ
          echo "$PWD/wasmtime-v${WASMTIME_VERSION}-x86_64-linux" >> "$GITHUB_PATH"
      - name: Ejecutar la sonda
        run: wasmtime run .build/wasm32-unknown-wasip1/debug/escriba-wasm-probe.wasm
