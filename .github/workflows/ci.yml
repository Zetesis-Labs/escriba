name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SWIFT_VERSION: 6.4.0

# Linux jobs run on the runner the repository variable LINUX_RUNNER names
# (herschel-runners in Zetesis-Labs); a clone without it uses GitHub's.
jobs:
  macos:
    name: macOS · Escriba y adaptador Swift 6.4
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conectores TypeScript y SDK npm
        run: |
          ./scripts/build-conectores.sh
          git diff --exit-code -- packages/conectores/dist packages/conectores/bundle
      - name: Toolchain de swift.org
        run: |
          curl -fsSL -o swift.pkg "https://download.swift.org/swift-${SWIFT_VERSION}-release/xcode/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE-osx.pkg"
          sudo installer -pkg swift.pkg -target /
          TOOLCHAIN=$(ls -d "/Library/Developer/Toolchains/swift-${SWIFT_VERSION}-RELEASE.xctoolchain")
          echo "TOOLCHAINS=$(plutil -extract CFBundleIdentifier raw "$TOOLCHAIN/Info.plist")" >> "$GITHUB_ENV"
      - run: swift --version
      - run: swift build
      - run: swift test
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Leer la versión de Bun del runtime
        id: bun
        run: |
          version=$(cat apps/tauri/runtime-host/bun-version)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - name: Aplicación Escriba, runtime aislado y SurrealDB
        run: |
          ./scripts/build-app.sh
          npm test --prefix apps/tauri
          cargo test --manifest-path apps/tauri/src-tauri/Cargo.toml --lib
          cargo clippy --manifest-path apps/tauri/src-tauri/Cargo.toml --all-targets -- -D warnings

  linux:
    name: Linux ${{ matrix.arch }} · paquetes y pruebas
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang cmake curl \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libasound2-dev espeak-ng
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Leer la versión de Bun del runtime
        id: bun
        run: |
          version=$(cat apps/tauri/runtime-host/bun-version)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - name: Construir los paquetes
        run: ./scripts/build-linux.sh --release
      # Before the tests, so the install matrix and the Flatpak check the packages anyway.
      - uses: actions/upload-artifact@v4
        with:
          name: escriba-linux-${{ matrix.arch }}
          path: |
            apps/tauri/src-tauri/target/release/bundle/deb/*.deb
            apps/tauri/src-tauri/target/release/bundle/rpm/*.rpm
      - name: Cargar el binding de SurrealDB con Node y con Bun
        working-directory: apps/tauri
        run: |
          export NATIVE=$(node --input-type=module -e "import { surrealNative } from './runtime-host/targets.mjs'; const native = surrealNative(process.platform, process.arch); console.log(process.cwd() + '/node_modules/' + native.package + '/' + native.file)")
          ls -l "$NATIVE"
          node -e 'require(process.env.NATIVE)'
          bun -e 'try { require(process.env.NATIVE) } catch (error) { console.error(error, error.cause); process.exit(1) }'
      - name: Pruebas
        run: |
          for crate in native-host sandbox src-tauri; do
            cargo fmt --manifest-path apps/tauri/$crate/Cargo.toml --check
            cargo clippy --manifest-path apps/tauri/$crate/Cargo.toml --all-targets -- -D warnings
          done
          cargo test --manifest-path apps/tauri/native-host/Cargo.toml
          cargo test --manifest-path apps/tauri/sandbox/Cargo.toml
          cargo test --manifest-path apps/tauri/src-tauri/Cargo.toml --lib
          npm test --prefix apps/tauri
          npm run typecheck:runtime --prefix apps/tauri

  linux-matriz:
    name: Linux ${{ matrix.arch }} · instala en ${{ matrix.image }}
    needs: linux
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64]
        image: ["ubuntu:24.04", "ubuntu:26.04", "debian:13", "fedora:44", "fedora:43"]
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: escriba-linux-${{ matrix.arch }}
          path: apps/tauri/src-tauri/target/release/bundle
      - name: Instalar y comprobar en un sistema limpio
        run: scripts/linux/matrix.sh "${{ matrix.image }}"

  linux-flatpak:
    name: Linux ${{ matrix.arch }} · Flatpak
    needs: linux
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: escriba-linux-${{ matrix.arch }}
          path: apps/tauri/src-tauri/target/release/bundle
      - name: flatpak-builder y Flathub
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak dbus
          # Ubuntu 24.04 blocks the unprivileged user namespaces bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # Ubuntu's flatpak-builder 1.4.2 lets CMake install into /app/lib64, where the tray modules do not look.
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder
      - name: Construir el Flatpak
        env:
          FLATPAK_BUILDER: flatpak run org.flatpak.Builder
        # The sandboxed builder installs the SDK through the session bus, which a runner lacks.
        run: dbus-run-session -- scripts/build-linux-flatpak.sh --bundle "$PWD/Escriba-${{ matrix.arch }}.flatpak"
      - uses: actions/upload-artifact@v4
        with:
          name: escriba-flatpak-${{ matrix.arch }}
          path: Escriba-${{ matrix.arch }}.flatpak
