name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SWIFT_VERSION: 6.4.0
  WASM_SDK_URL: https://download.swift.org/swift-6.4.0-release/wasm-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_wasm.artifactbundle.tar.gz
  WASM_SDK_CHECKSUM: f07b7be3c586d92d7a07051fc6d303b87ebea67eadc40640ba59d5a8b79aa86d
  WASMTIME_VERSION: 48.0.2

jobs:
  macos:
    name: macOS · build, tests y app con Swift 6.4
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: La receta por defecto compilada coincide con su fuente
        run: |
          ./scripts/build-recetas.sh
          git diff --exit-code -- Sources/EscribaJSC/DefaultRecipe.swift
      - name: Toolchain de swift.org
        run: |
          curl -fsSL -o swift.pkg "https://download.swift.org/swift-${SWIFT_VERSION}-release/xcode/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE-osx.pkg"
          sudo installer -pkg swift.pkg -target /
          TOOLCHAIN=$(ls -d /Library/Developer/Toolchains/swift-${SWIFT_VERSION}-RELEASE.xctoolchain)
          echo "TOOLCHAINS=$(plutil -extract CFBundleIdentifier raw "$TOOLCHAIN/Info.plist")" >> "$GITHUB_ENV"
      - run: swift --version
      - run: swift build
      - run: swift test
      - name: Empaquetar la app
        run: ./scripts/build-app.sh

  linux:
    name: Linux · targets portables y de sistema
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev
      - name: Compilar lo que corre en un pod
        run: |
          for target in EscribaCore EscribaEngine EscribaSystemKit EscribaNotion EscribaOpenAI EscribaStore EscribaIntelligence; do
            swift build --target "$target"
          done

  wasi:
    name: WASI · el nucleo viaja
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -qq && apt-get install -y -qq curl xz-utils
      - name: SDK de WebAssembly
        run: swift sdk install "$WASM_SDK_URL" --checksum "$WASM_SDK_CHECKSUM"
      - name: Compilar motor y conector a wasm32-unknown-wasi
        run: |
          swift build --swift-sdk swift-6.4.0-RELEASE_wasm --target EscribaEngine
          swift build --swift-sdk swift-6.4.0-RELEASE_wasm --target EscribaNotion
          swift build --swift-sdk swift-6.4.0-RELEASE_wasm --product escriba-wasm-probe
      - name: Runtime WASI (wasmtime, fijado)
        run: |
          curl -sSL "https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/wasmtime-v${WASMTIME_VERSION}-x86_64-linux.tar.xz" | tar -xJ
          echo "$PWD/wasmtime-v${WASMTIME_VERSION}-x86_64-linux" >> "$GITHUB_PATH"
      - name: Ejecutar la sonda
        run: |
          BIN=$(swift build --swift-sdk swift-6.4.0-RELEASE_wasm --product escriba-wasm-probe --show-bin-path)
          wasmtime run "$BIN/escriba-wasm-probe.wasm"
