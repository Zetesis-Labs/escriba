name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SWIFT_VERSION: 6.4.0
  WASM_SDK_URL: https://download.swift.org/swift-6.4.0-release/wasm-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_wasm.artifactbundle.tar.gz
  WASM_SDK_CHECKSUM: f07b7be3c586d92d7a07051fc6d303b87ebea67eadc40640ba59d5a8b79aa86d

jobs:
  macos:
    name: macOS · build, tests y app con Swift 6.4
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: La receta por defecto y la plantilla de recetas coinciden con su fuente
        run: |
          ./scripts/build-recetas.sh
          git diff --exit-code -- Sources/EscribaJSC/DefaultRecipe.swift Sources/EscribaCore/RecipeTemplate.swift
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conectores TypeScript y SDK npm
        run: |
          ./scripts/build-conectores.sh
          git diff --exit-code -- packages/conectores/dist Sources/EscribaJSC/Resources/conectores
      - name: Toolchain de swift.org
        run: |
          curl -fsSL -o swift.pkg "https://download.swift.org/swift-${SWIFT_VERSION}-release/xcode/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE-osx.pkg"
          sudo installer -pkg swift.pkg -target /
          TOOLCHAIN=$(ls -d /Library/Developer/Toolchains/swift-${SWIFT_VERSION}-RELEASE.xctoolchain)
          echo "TOOLCHAINS=$(plutil -extract CFBundleIdentifier raw "$TOOLCHAIN/Info.plist")" >> "$GITHUB_ENV"
      - run: swift --version
      - run: swift build
      - name: esbuild para los tests de compilación de recetas
        run: ./scripts/descargar-esbuild.sh
      - run: swift test
      - name: Empaquetar la app
        run: ./scripts/build-app.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.6.9
      - name: Aplicación Tauri, runtime aislado y SurrealDB
        run: |
          ./scripts/build-tauri.sh
          npm test --prefix apps/tauri
          cargo test --manifest-path apps/tauri/src-tauri/Cargo.toml --lib
          cargo clippy --manifest-path apps/tauri/src-tauri/Cargo.toml --all-targets -- -D warnings

  linux:
    name: Linux · targets portables y de sistema
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev
      - name: Compilar lo que corre en un pod
        run: |
          for target in EscribaCore EscribaEngine EscribaSystemKit EscribaOpenAI EscribaStore EscribaIntelligence; do
            swift build --target "$target"
          done

  wasi:
    name: WASI · el nucleo viaja
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update -qq && apt-get install -y -qq curl xz-utils
      - name: SDK de WebAssembly
        run: swift sdk install "$WASM_SDK_URL" --checksum "$WASM_SDK_CHECKSUM"
      - name: Compilar el motor a wasm32-unknown-wasi
        run: |
          swift build --swift-sdk swift-6.4.0-RELEASE_wasm --target EscribaEngine
