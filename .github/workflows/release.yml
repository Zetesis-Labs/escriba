# Los tags creados con GITHUB_TOKEN no inician otro workflow: los paquetes se adjuntan aquí.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release existente a la que añadir macOS (por ejemplo, v0.2.0)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

# The run in progress may be tagging or publishing.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  linux:
    name: Linux x86_64 · paquetes de la release
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ${{ vars.LINUX_RUNNER || 'ubuntu-24.04' }}
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      VERSION: ${{ needs.release-please.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - name: La versión de la app coincide con el tag
        run: |
          version=$(node -p "require('./apps/tauri/src-tauri/tauri.conf.json').version")
          test "v$version" = "$TAG" || { echo "tauri.conf.json dice $version y el tag es $TAG"; exit 1; }
      - uses: ./.github/actions/linux-paquetes
      - uses: ./.github/actions/flatpak
        with:
          bundle: ${{ github.workspace }}/Escriba_${{ needs.release-please.outputs.version }}_x86_64.flatpak
      - name: Subir los paquetes a la release
        run: |
          bundle=apps/tauri/src-tauri/target/release/bundle
          files=("$bundle"/deb/Escriba_"$VERSION"_*.deb "$bundle"/rpm/Escriba-"$VERSION"-*.rpm "Escriba_${VERSION}_x86_64.flatpak")
          ls -l "${files[@]}"
          sha256sum "${files[@]}" | sed 's|  .*/|  |' > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" "${files[@]}" SHA256SUMS --repo "$GITHUB_REPOSITORY"

  windows:
    name: Windows x64 · instalador de la release
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: windows-2022
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: ./.github/actions/windows-paquetes
      - name: Subir el instalador y sus hashes
        shell: pwsh
        run: |
          $files = @(Get-ChildItem apps/tauri/src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($files.Count -eq 0) { throw 'Falta el instalador de Windows' }
          $checksums = $files | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path -Leaf $_.Path)" }
          $checksums | Set-Content SHA256SUMS-Windows -Encoding utf8NoBOM
          $paths = @($files.FullName) + @('SHA256SUMS-Windows')
          gh release upload $env:TAG @paths --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo adjuntar la distribución de Windows' }

  macos:
    name: macOS arm64 · paquete de la release
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: macos-26
    defaults:
      run:
        working-directory: source
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}
      SWIFT_VERSION: 6.4.0
      MACOS_NOTARIZE: ${{ vars.MACOS_NOTARIZE || 'false' }}
      APPLE_SIGNING_IDENTITY: '-'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Comprobar la release de destino
        working-directory: .
        run: |
          case "$MACOS_NOTARIZE" in true|false) ;; *) echo "MACOS_NOTARIZE debe ser true o false" >&2; exit 1 ;; esac
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag de versión no válido: $TAG" >&2; exit 1; }
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" = "$TAG"
          test "$(uname -m)" = arm64
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: source
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: release-tools
          sparse-checkout: scripts
          persist-credentials: false
      - name: Pruebas del empaquetado y la notarización
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s ../release-tools/scripts/tests -p test_macos_package.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: La versión de la app coincide con el tag
        run: |
          version=$(node -p "require('./apps/tauri/src-tauri/tauri.conf.json').version")
          test "v$version" = "$TAG" || { echo "tauri.conf.json dice $version y el tag es $TAG" >&2; exit 1; }
      - name: Toolchain de swift.org
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swift.pkg" "https://download.swift.org/swift-${SWIFT_VERSION}-release/xcode/swift-${SWIFT_VERSION}-RELEASE/swift-${SWIFT_VERSION}-RELEASE-osx.pkg"
          sudo installer -pkg "$RUNNER_TEMP/swift.pkg" -target /
          toolchain="/Library/Developer/Toolchains/swift-${SWIFT_VERSION}-RELEASE.xctoolchain"
          echo "TOOLCHAINS=$(plutil -extract CFBundleIdentifier raw "$toolchain/Info.plist")" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - name: Leer la versión de Bun del runtime
        id: bun
        run: |
          version=$(cat apps/tauri/runtime-host/bun-version)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun.outputs.version }}
      - name: Construir la app
        run: ./scripts/build-app.sh --release
      - name: Firmar, notarizar cuando esté activado y empaquetar
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ../release-tools/scripts/package-macos.sh apps/tauri/src-tauri/target/release/bundle/macos/Escriba.app "$TAG" release-macos
      - uses: actions/upload-artifact@v4
        with:
          name: escriba-macos-arm64
          path: source/release-macos/
          if-no-files-found: error
      - name: Subir el paquete de macOS a la release
        run: |
          gh release upload "$TAG" release-macos/*.zip release-macos/SHA256SUMS-macos-arm64 --repo "$GITHUB_REPOSITORY" --clobber
          previous="Escriba_${TAG#v}_macos_arm64.zip"
          if [[ "$MACOS_NOTARIZE" == true ]]; then previous="Escriba_${TAG#v}_macos_arm64_unnotarized.zip"; fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/release-assets"
          if grep -Fxq "$previous" "$RUNNER_TEMP/release-assets"; then
            gh release delete-asset "$TAG" "$previous" --repo "$GITHUB_REPOSITORY" --yes
          fi
