name: Escriba Windows
description: Construye los motores y el instalador de Windows x64
inputs:
  prepare-only:
    description: Prepara y comprueba los motores sin compilar la interfaz Tauri
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Leer la versión de Bun del runtime
      id: bun
      shell: pwsh
      run: |
        $version = (Get-Content apps/tauri/runtime-host/bun-version -Raw).Trim()
        if (!$version) { throw 'Falta la versión fijada de Bun' }
        "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ steps.bun.outputs.version }}
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
        workspaces: |
          apps/tauri/native-host
          apps/tauri/sandbox
          apps/tauri/src-tauri
    - uses: actions/cache@v4
      with:
        path: apps/tauri/native-host/target/sherpa-onnx-prebuilt
        key: sherpa-windows-x64-${{ hashFiles('apps/tauri/native-host/Cargo.lock') }}
    - name: Herramientas nativas
      shell: pwsh
      run: |
        choco install nasm llvm -y --no-progress
        "$env:ProgramFiles\NASM" | Out-File $env:GITHUB_PATH -Append
        "LIBCLANG_PATH=$env:ProgramFiles\LLVM\bin" | Out-File $env:GITHUB_ENV -Append
    - name: Preparar y construir Windows
      shell: pwsh
      run: |
        $buildOptions = @{}
        if ('${{ inputs.prepare-only }}' -eq 'true') { $buildOptions.PrepareOnly = $true }
        ./scripts/build-windows.ps1 @buildOptions
