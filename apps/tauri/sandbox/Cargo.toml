[package]
name = "escriba-sandbox"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "escriba-sandbox"
path = "src/main.rs"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
seccompiler = "0.5.0"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
sha2 = "0.10"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Isolation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Console", "Win32_System_Memory"] }

[profile.release]
strip = "symbols"
lto = "thin"

[dev-dependencies]
tempfile = "3"
