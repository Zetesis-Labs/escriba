[package]
name = "escriba-native-host"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "EscribaNativeHost"
path = "src/main.rs"

[dependencies]
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
symphonia = { version = "0.5", default-features = false, features = ["aac", "adpcm", "aiff", "alac", "caf", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }

cpal = "0.16"
opus = "0.3"
audiopus_sys = { version = "0.2", features = ["static"] }
ogg = "0.9"
whisper-rs = "0.15"
sherpa-onnx = { version = "1.13.8", default-features = false, features = ["shared"] }
ureq = "3"
rubato = "0.16"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = "symbols"
lto = "thin"
